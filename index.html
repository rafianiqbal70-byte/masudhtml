<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>IPRN Live Auto Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
        .container { max-width: 900px; margin: auto; background: #252526; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        pre { background: #1e1e1e; color: #9cdcfe; padding: 15px; border-radius: 5px; overflow-x: auto; font-family: Consolas, monospace; font-size: 14px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <pre id="output">Loading live data...</pre>
</div>

<script>
async function fetchJsonData() {
    const url = "https://api.iprn-elite.com/v1.0?api_key=k1-l6xxdRbixXbsPyjWxyQ";
    
    const now = new Date();
    const endDate = now.toISOString();
    const startDate = new Date(now.getTime() - (24 * 60 * 60 * 1000)).toISOString();

    const payload = {
        "id": null,
        "jsonrpc": "2.0",
        "method": "sms.mdr_full:get_list",
        "params": {
            "filter": {
                "start_date": startDate,
                "end_date": endDate
            },
            "page": 1,
            "per_page": 15
        }
    };

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const resultJson = await response.json();
        
        let cleanData = resultJson;
        if (resultJson && resultJson.result && resultJson.result.mdr_full_list) {
            cleanData = { "records": resultJson.result.mdr_full_list };
        }

        document.getElementById("output").innerText = JSON.stringify(cleanData, null, 4);
        
    } catch (error) {
        document.getElementById("output").innerText = "Error: " + error.message;
    }
}

window.onload = function() {
    fetchJsonData();
};
</script>

</body>
</html>
